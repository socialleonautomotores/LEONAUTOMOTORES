<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leon Automotores</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Alibaba+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          crossorigin="anonymous"
          referrerpolicy="no-referrer" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        p,
        a,
        div {
            font-family: 'Alibaba Sans', Arial, sans-serif;
            color: #1c1c1c;
        }

        body,
        html {
            height: 100%;
            scroll-behavior: smooth;
        }

        /* Hero */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100vh;
            background: linear-gradient(135deg, #1c1c1c, #333333);
            color: white;
            padding: 0 20px;
        }

        .hero img {
            max-width: 500px;
            width: 100%;
            height: auto;
            margin-bottom: 40px;
        }

        .hero .buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hero .buttons a {
            text-decoration: none;
            padding: 12px 25px;
            border: 2px solid #D4AF37;
            color: #D4AF37;
            background-color: transparent;
            font-weight: 700;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .hero .buttons a:hover {
            background-color: #D4AF37;
            color: #1c1c1c;
            transform: translateY(-2px);
        }

        /* Ocultar temporalmente Flota */
        #flota,
        .hero .buttons a[href="#flota"] {
            display: none !important;
        }

        /* Secciones */
        section {
            padding: 80px 20px;
            text-align: center;
        }

        /* Quienes Somos */
        #quienes-somos {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 30px;
            background-color: #f9f9f9;
        }

        #quienes-somos .texto {
            flex: 1 1 400px;
            max-width: 600px;
            text-align: justify;
        }

        #quienes-somos .texto h2 {
            margin-bottom: 20px;
        }

        #quienes-somos .texto p {
            font-style: italic;
            line-height: 1.5;
        }

        #quienes-somos .firma {
            margin-top: 15px;
            font-style: italic;
            font-size: 0.95rem;
            color: #555;
        }

        #quienes-somos .foto-gerente {
            flex: 0 0 70px;
            border-radius: 50%;
            border: 3px solid #D4AF37;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            object-fit: cover;
        }

        /* Novedades */
        #novedades {
            background-color: #fff;
        }

        #novedades h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        #novedades p {
            margin-bottom: 40px;
            color: #555;
        }

        /* Contacto */
        #contactenos {
            background-color: #fff;
            min-height: 400px;
        }

        #contactenos h2 {
            margin-bottom: 30px;
        }

        .contact-social {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .contact-social a {
            width: 55px;
            height: 55px;
            border: 2px solid #D4AF37;
            color: #D4AF37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            transition: all 0.3s;
            text-decoration: none;
        }

        .contact-social a:hover {
            background-color: #D4AF37;
            color: #1c1c1c;
            transform: translateY(-2px);
        }

        #contactenos .contact-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        #contactenos .formulario,
        #contactenos .mapa {
            flex: 1 1 400px;
            max-width: 500px;
            display: flex;
            flex-direction: column;
        }

        #contactenos .mapa iframe {
            flex: 1;
            width: 100%;
        }

        #contactenos input,
        #contactenos select,
        #contactenos textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        #contactenos button {
            padding: 12px 25px;
            border: 2px solid #D4AF37;
            color: #D4AF37;
            background-color: transparent;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #contactenos button:hover {
            background-color: #D4AF37;
            color: #1c1c1c;
            transform: translateY(-2px);
        }

        footer {
            background-color: #1c1c1c;
            color: white;
            padding: 20px;
            text-align: center;
        }

        footer a {
            color: white;
        }

        /* Botones flotantes */
        .whatsapp-float,
        .backtotop-float {
            position: fixed;
            bottom: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #fff;
            z-index: 1000;
        }

        .whatsapp-float {
            background-color: #25d366;
            right: 20px;
        }

        .backtotop-float {
            background-color: #333;
            right: 90px;
        }

        @media (max-width: 768px) {
            .hero img {
                max-width: 360px;
            }

            .tagembed-wrapper iframe {
                height: 500px;
            }
        }

        .tagembed-wrapper iframe {
            max-width: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body id="top">
    <!-- Hero -->
    <section class="hero">
        <img src="leon-logo.png" alt="Leon Automotores">
        <div class="buttons">
            <a href="#quienes-somos">QUIENES SOMOS</a>
            <a href="#novedades">NOVEDADES</a>
            <a href="#flota">NUESTRA FLOTA</a>
            <a href="#contactenos">CONTACTANOS</a>
        </div>
    </section>

    <!-- Quienes Somos -->
    <section id="quienes-somos">
        <div class="texto">
            <h2>QUIENES SOMOS</h2>
            <p>En Leon Automotores...</p>
            <p class="firma">Leonardo Mañez, Gerente en León Automotores.</p>
        </div>
        <img src="gerente.jpg" class="foto-gerente" alt="Gerente">
    </section>

    <!-- Novedades -->
    <section id="novedades">
        <h2>NOVEDADES</h2>
        <p>Mirá nuestras últimas publicaciones en Instagram.</p>

        <div class="tagembed-wrapper">
            <iframe src="https://widget.tagembed.com/314807?website=1"
                    allow="fullscreen"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                    style="width:100%; height:420px; border:none;">
            </iframe>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 LEÓN AUTOMOTORES</p>
    </footer>

    <a href="#top" class="backtotop-float">⬆</a>
    <a href="https://wa.me/5493584828385" class="whatsapp-float">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        window.addEventListener('load', () => {
            window.scrollTo(0, 0);
        });
    </script>
</body>
</html>
